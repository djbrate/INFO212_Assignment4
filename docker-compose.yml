# Local Neo4j for development (docs/implementation_plan.md, Phase 0).
# Start:  docker compose up -d     Browser: http://localhost:7474
# Reads NEO4J_USER and NEO4J_PASSWORD from .env in this folder.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: ektemat-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (used by the app)
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    volumes:
      # Not "./neo4j/...": a folder called neo4j in the project root hides the
      # neo4j Python driver ("cannot import name 'GraphDatabase'"). Ignored by .gitignore.
      - ./.neo4j-data/data:/data
      - ./.neo4j-data/logs:/logs
    restart: unless-stopped
