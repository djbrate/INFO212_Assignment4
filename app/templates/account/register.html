{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Create an account</h1>
  <form class="form" method="post">
    <label>Name <input name="name" value="{{ form.get('name', '') }}" required autocomplete="name"></label>
    <label>E-mail <input type="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email"></label>
    <label>Password (at least 8 characters) <input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
    <label>Repeat password <input type="password" name="password2" minlength="8" required autocomplete="new-password"></label>
    <button class="btn btn-primary" type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('account.login', next=request.args.get('next')) }}">Log in</a></p>
  <p class="muted small">We only store your name, e-mail and orders. Allergy notes are stored per guest group, never per named guest.</p>
</div>
{% endblock %}
