{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Log in</h1>
  <form class="form" method="post">
    <label>E-mail <input type="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p>New customer? <a href="{{ url_for('account.register', next=request.args.get('next')) }}">Create an account</a></p>
</div>
{% endblock %}
